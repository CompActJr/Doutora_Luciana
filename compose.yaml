# Use sempre com compose.dev.yaml ou compose.prod.yaml; veja README.md.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Configure APP_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Configure N8N_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  migrate:
    image: dra-backend-migrate:${APP_VERSION:-local}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://dra_app:${APP_DB_PASSWORD:?Configure APP_DB_PASSWORD}@postgres:5432/dra_app
    networks: [database]
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

  backend:
    image: dra-backend:${APP_VERSION:-local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_URL: postgresql://dra_app:${APP_DB_PASSWORD:?Configure APP_DB_PASSWORD}@postgres:5432/dra_app
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Configure BETTER_AUTH_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      AUTH_TRUST_PROXY: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    networks: [application, database]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    stop_grace_period: 15s
    security_opt: [no-new-privileges:true]
    logging: *logging

  frontend:
    image: dra-frontend:${APP_VERSION:-local}
    restart: unless-stopped
    init: true
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      API_INTERNAL_URL: http://backend:3001
    networks: [application]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt: [no-new-privileges:true]
    logging: *logging

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.6
    restart: unless-stopped
    init: true
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: dra_n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Configure N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Configure N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_LOG_LEVEL: warn
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [application, database]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    security_opt: [no-new-privileges:true]
    logging: *logging

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:-localhost}
      N8N_DOMAIN: ${N8N_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [application]
    depends_on:
      frontend: { condition: service_started }
      backend: { condition: service_started }
    security_opt: [no-new-privileges:true]
    logging: *logging

networks:
  application:
  database:
    internal: true

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
