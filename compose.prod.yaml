name: dra-prod
services:
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
  backend:
    environment:
      APP_ORIGIN: https://${PANEL_DOMAIN:?Configure PANEL_DOMAIN}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
    cap_drop: [ALL]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
    cap_drop: [ALL]
    volumes:
      - frontend_cache:/app/frontend/.next/cache
  n8n:
    environment:
      N8N_HOST: ${N8N_DOMAIN:?Configure N8N_DOMAIN}
      N8N_PROTOCOL: https
      N8N_SECURE_COOKIE: "true"
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN:?Configure N8N_DOMAIN}/
      WEBHOOK_URL: https://${N8N_DOMAIN:?Configure N8N_DOMAIN}/
  caddy:
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?Configure PANEL_DOMAIN}
      N8N_DOMAIN: ${N8N_DOMAIN:?Configure N8N_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Configure ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  frontend_cache:
